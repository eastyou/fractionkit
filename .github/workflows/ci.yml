name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test fraction bars
        shell: bash
        run: |
          python -m fractionkit --max-denominator 12 --copies 2 --title 分数条教具 -o examples/分数条教具.html
          python -c "p = open('examples/分数条教具.html', encoding='utf-8').read(); assert p.count('1 整条 = 1') == 22; assert p.count('33.3%') >= 1; assert p.count('怎么用') == 1; assert 'A4 portrait' in p; print('smoke ok')"
          python -m fractionkit --max-denominator 16 --copies 4 -o fractionkit-max.html
          python -c "p = open('fractionkit-max.html', encoding='utf-8').read(); assert p.count('<section') == 6; assert p.count('1 整条 = 1') == 60; assert p.count('第 5 / 5 页') == 1; print('max ok')"
